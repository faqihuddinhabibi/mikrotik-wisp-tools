<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tagihan Jatuh Tempo Besok</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:linear-gradient(160deg,#fff7ed,#f4f6fb 40%);color:#1c2333;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:#fff;width:100%;max-width:440px;border-radius:20px;padding:32px 26px;
    box-shadow:0 12px 40px rgba(120,80,20,.12);text-align:center}
  .logo{width:64px;height:64px;border-radius:16px;margin:0 auto 18px;
    background:linear-gradient(135deg,#f59e0b,#fbbf24);display:flex;align-items:center;
    justify-content:center;font-size:30px}
  h1{font-size:22px;line-height:1.3;margin-bottom:8px}
  .biz{color:#d97706;font-weight:700}
  p.lead{color:#5b6472;font-size:15px;line-height:1.6;margin-bottom:22px}
  .badge{display:inline-block;background:#fef3c7;color:#b45309;font-weight:600;
    padding:6px 14px;border-radius:999px;font-size:13px;margin-bottom:18px}
  .btn{display:block;width:100%;padding:15px;border-radius:12px;border:none;font-size:16px;
    font-weight:700;text-decoration:none;cursor:pointer;margin-bottom:12px}
  .btn-wa{background:#16a34a;color:#fff}
  .foot{font-size:12px;color:#5b6472;margin-top:14px;line-height:1.6}
</style>
</head>
<body>
  <main class="card">
    <div class="logo">🔔</div>
    <h1>Jatuh Tempo <b>Besok</b><br><span class="biz">FiberNode Internet</span></h1>

    <p class="lead">
      Halo Pelanggan 👋<br>
      Tagihan internet Anda <b>jatuh tempo besok</b>. Yuk siapkan pembayaran
      dari sekarang supaya layanan tidak terganggu.
    </p>
    <a class="btn btn-wa" href="https://wa.me/6281234567890?text=Halo%20admin%2C%20saya%20mau%20bayar%20tagihan%20internet">
      💬 Bayar / Konfirmasi via WhatsApp
    </a>
    <p class="foot">Abaikan jika sudah membayar.</p>
  </main>
</body>
</html>
