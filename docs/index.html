<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pengingat Tagihan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0a1330;
    --navy-2:#0d1b45;
    --cyan:#38e0d4;
    --cyan-soft:#7ff0e8;
    --indigo:#5b7cfa;
    --ink:#f4f8ff;
    --muted:#9fb2d8;
    --wa:#25d366;
    --wa-dark:#1eb857;
    --font: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    font-family:var(--font);
    color:var(--ink);
    background:
      radial-gradient(120% 80% at 50% -10%, #16307a 0%, rgba(22,48,122,0) 55%),
      radial-gradient(90% 60% at 85% 15%, rgba(56,224,212,.22) 0%, rgba(56,224,212,0) 60%),
      linear-gradient(180deg, var(--navy-2) 0%, var(--navy) 55%, #060c22 100%);
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:32px 22px;
    overflow:hidden;
  }

  /* atmosfer: garis serat optik samar */
  .weave{position:fixed; inset:0; z-index:0; opacity:.35; pointer-events:none}
  .weave svg{width:100%; height:100%}

  .wrap{
    position:relative; z-index:1;
    width:100%; max-width:400px; text-align:center;
    animation:rise .7s cubic-bezier(.2,.7,.2,1) both;
  }

  /* eyebrow / brand */
  .brand{
    display:inline-flex; align-items:center; gap:8px;
    font-size:12px; font-weight:700; letter-spacing:.18em; text-transform:uppercase;
    color:var(--cyan-soft); margin-bottom:38px;
  }
  .brand .dot{width:7px; height:7px; border-radius:50%; background:var(--cyan);
    box-shadow:0 0 12px var(--cyan)}

  /* SIGNATURE: badge lonceng + cincin sinyal berdenyut */
  .signal{position:relative; width:132px; height:132px; margin:0 auto 30px}
  .signal .ring{
    position:absolute; inset:0; margin:auto; border-radius:50%;
    border:1.5px solid var(--cyan);
    animation:pulse 2.6s ease-out infinite;
  }
  .signal .ring:nth-child(2){animation-delay:.9s}
  .signal .ring:nth-child(3){animation-delay:1.8s}
  .badge{
    position:absolute; inset:0; margin:auto; width:80px; height:80px; border-radius:26px;
    background:linear-gradient(145deg, #2a4bd0 0%, #38e0d4 100%);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 12px 34px rgba(56,224,212,.35), inset 0 1px 0 rgba(255,255,255,.4);
  }
  .badge svg{width:38px; height:38px; display:block}

  h1{
    font-size:30px; line-height:1.25; font-weight:800; letter-spacing:-.01em;
    margin-bottom:16px;
  }
  h1 .hl{
    color:var(--cyan);
    text-shadow:0 0 24px rgba(56,224,212,.5);
  }
  p.lead{
    font-size:16px; line-height:1.65; font-weight:400; color:var(--muted);
    margin:0 auto 34px; max-width:320px;
  }

  .btn{
    display:flex; align-items:center; justify-content:center; gap:10px;
    width:100%; min-height:58px; padding:0 20px; border-radius:16px;
    background:linear-gradient(180deg, var(--wa) 0%, var(--wa-dark) 100%);
    color:#04210f; text-decoration:none; font-size:17px; font-weight:700;
    box-shadow:0 10px 26px rgba(37,211,102,.32);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:hover{transform:translateY(-2px); box-shadow:0 14px 32px rgba(37,211,102,.42)}
  .btn:active{transform:translateY(0)}
  .btn:focus-visible{outline:3px solid var(--cyan-soft); outline-offset:3px}
  .btn svg{width:22px; height:22px}

  .foot{
    margin-top:22px; font-size:13px; color:var(--muted);
  }

  @keyframes pulse{
    0%{transform:scale(.42); opacity:.9}
    70%{opacity:0}
    100%{transform:scale(1); opacity:0}
  }
  @keyframes rise{from{opacity:0; transform:translateY(16px)} to{opacity:1; transform:none}}

  @media (prefers-reduced-motion: reduce){
    .wrap{animation:none}
    .signal .ring{animation:none; opacity:.25}
  }
  @media (max-width:360px){
    h1{font-size:26px}
    p.lead{font-size:15px}
  }
</style>
</head>
<body>
  <!-- atmosfer serat optik -->
  <div class="weave" aria-hidden="true">
    <svg viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice" fill="none">
      <path d="M-40 120 C120 200 280 40 460 140" stroke="#38e0d4" stroke-width="1" opacity=".5"/>
      <path d="M-40 260 C140 340 300 180 470 300" stroke="#5b7cfa" stroke-width="1" opacity=".4"/>
      <path d="M-40 560 C120 640 300 500 470 620" stroke="#38e0d4" stroke-width="1" opacity=".35"/>
    </svg>
  </div>

  <main class="wrap">
    <div class="brand"><span class="dot"></span>Pemberitahuan</div>

    <!-- SIGNATURE: sinyal berdenyut -->
    <div class="signal" aria-hidden="true">
      <span class="ring"></span><span class="ring"></span><span class="ring"></span>
      <div class="badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="#04210f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
      </div>
    </div>

    <h1>Tagihan internet<br>jatuh tempo <span class="hl">besok</span></h1>

    <p class="lead">
      Mohon siapkan pembayaran hari ini agar internet tetap menyala tanpa terputus.
    </p>

    <!-- GANTI: nomor WA (format 62...) -->
    <a class="btn" href="https://wa.me/6281234567890?text=Halo%20admin%2C%20saya%20mau%20bayar%20tagihan%20internet">
      <svg viewBox="0 0 24 24" fill="#04210f"><path d="M12.04 2c-5.5 0-9.96 4.46-9.96 9.96 0 1.76.46 3.48 1.34 5L2 22l5.2-1.36c1.46.8 3.1 1.22 4.84 1.22 5.5 0 9.96-4.46 9.96-9.96S17.54 2 12.04 2zm5.8 14.06c-.24.68-1.42 1.3-1.96 1.34-.5.06-1.14.08-1.84-.12-.42-.14-.96-.32-1.66-.62-2.92-1.26-4.82-4.2-4.96-4.4-.14-.2-1.2-1.6-1.2-3.04 0-1.44.76-2.14 1.02-2.44.26-.3.58-.38.78-.38.2 0 .38 0 .56.02.18 0 .42-.06.66.5.24.56.82 1.94.9 2.08.08.14.12.3.02.5-.1.2-.14.32-.28.5-.14.16-.3.36-.42.48-.14.14-.28.3-.12.58.16.28.72 1.18 1.54 1.92 1.06.94 1.94 1.24 2.22 1.38.28.14.44.12.6-.08.16-.2.68-.8.86-1.08.18-.28.36-.22.6-.14.24.08 1.56.74 1.82.88.28.14.46.2.52.32.08.12.08.68-.16 1.36z"/></svg>
      Hubungi Admin via WhatsApp
    </a>

    <div class="foot">Abaikan pesan ini jika sudah membayar</div>
  </main>
</body>
</html>
