<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pengingat Tagihan</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:#f7f8fa; color:#1a1a1a; min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{
    background:#fff; width:100%; max-width:380px; border-radius:18px;
    padding:40px 28px; text-align:center;
    box-shadow:0 4px 24px rgba(0,0,0,.06);
  }
  .icon{font-size:44px; margin-bottom:20px}
  .biz{font-size:13px; letter-spacing:.08em; text-transform:uppercase;
    color:#8a8f98; font-weight:600; margin-bottom:24px}
  h1{font-size:22px; font-weight:700; line-height:1.35; margin-bottom:14px}
  h1 span{color:#e8873a}
  p{color:#6b7280; font-size:15px; line-height:1.6; margin-bottom:28px}
  .btn{
    display:block; width:100%; padding:15px; border-radius:12px;
    background:#111827; color:#fff; text-decoration:none;
    font-size:15px; font-weight:600;
  }
  .foot{margin-top:18px; font-size:12px; color:#9ca3af}
</style>
</head>
<body>
  <main class="card">
    <div class="icon">🔔</div>

    <!-- GANTI: nama usaha -->
    <div class="biz">FiberNode Internet</div>

    <h1>Tagihan jatuh tempo <span>besok</span></h1>

    <p>
      Halo 👋 Tagihan internet Anda jatuh tempo besok.
      Mohon lakukan pembayaran agar layanan tetap aktif.
    </p>

    <!-- GANTI: nomor WA (format 62...) -->
    <a class="btn" href="https://wa.me/6281234567890?text=Halo%20admin%2C%20saya%20mau%20bayar%20tagihan%20internet">
      Hubungi Admin
    </a>

    <div class="foot">Abaikan jika sudah membayar.</div>
  </main>
</body>
</html>
