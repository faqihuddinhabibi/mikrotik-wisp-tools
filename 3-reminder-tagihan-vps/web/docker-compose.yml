# Jalankan dari folder 3-reminder-tagihan-vps/web/ :  docker compose up -d --build
services:
  reminder-web:
    build:
      context: ../..                    # root repo (biar Dockerfile bisa COPY docs/)
      dockerfile: 3-reminder-tagihan-vps/web/Dockerfile
    image: mikrotik-reminder-web:latest
    container_name: reminder-web
    restart: unless-stopped
    ports:
      - "80:80"                         # ganti ke "8080:80" kalau port 80 VPS sudah dipakai
